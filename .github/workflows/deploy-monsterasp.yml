name: Deploy to MonsterASP.net

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        working-directory: backend/src/FinancialPlatform.AllServices
        run: dotnet publish --no-build --configuration Release --runtime win-x86 --output ./publish

      - name: Prepare Publish Profile
        shell: pwsh
        run: |
          # Decode the publish profile from base64 secret
          $profileBytes = [System.Convert]::FromBase64String('${{ secrets.MONSTERASP_PUBLISH_PROFILE }}')
          $profileContent = [System.Text.Encoding]::UTF8.GetString($profileBytes)
          $profileContent | Out-File -FilePath "./velocityclear.runasp.net-WebDeploy.publishSettings" -Encoding UTF8 -Force
          Write-Host "✓ Publish profile prepared"

      - name: Deploy via MSDeploy
        shell: pwsh
        run: |
          .\deploy.ps1 `
            -SourcePath "./backend/src/FinancialPlatform.AllServices/publish" `
            -PublishProfilePath "./velocityclear.runasp.net-WebDeploy.publishSettings"
